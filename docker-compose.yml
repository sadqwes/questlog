# Локальный запуск: docker compose up --build → http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: questlog
      POSTGRES_PASSWORD: questlog
      POSTGRES_DB: questlog
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questlog"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      PGHOST: db
      PGUSER: questlog
      PGPASSWORD: questlog
      PGDATABASE: questlog
      PGSSLMODE: disable
      # Только для локального запуска: логин questlog, пароль questlog-local
      QUESTLOG_USER: questlog
      QUESTLOG_PASSWORD_HASH: "$$2a$$12$$iNn/IhYRLETxEkjPZ3BGguFGkQh9s4bjM2f0m.rL8UvW1MWj7Qjsa"
      QUESTLOG_API_TOKEN: local-dev-token-not-for-production-0001
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
