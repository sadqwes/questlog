# Локальный запуск: docker compose up --build → http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: questlog
      POSTGRES_PASSWORD: questlog
      POSTGRES_DB: questlog
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questlog"]
      interval: 2s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: questlog
      MINIO_ROOT_PASSWORD: questlog-local-secret
    volumes: [photos:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 20

  # один раз создаёт bucket — в лабе это делает Helm-чарт MinIO
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 questlog questlog-local-secret && mc mb --ignore-existing local/questlog-photos"]
    depends_on:
      minio: {condition: service_healthy}

  app:
    build: .
    environment:
      PGHOST: db
      PGUSER: questlog
      PGPASSWORD: questlog
      PGDATABASE: questlog
      PGSSLMODE: disable
      # Только для локального запуска: логин questlog, пароль questlog-local
      QUESTLOG_USER: questlog
      QUESTLOG_PASSWORD_HASH: "$$2a$$12$$iNn/IhYRLETxEkjPZ3BGguFGkQh9s4bjM2f0m.rL8UvW1MWj7Qjsa"
      QUESTLOG_API_TOKEN: local-dev-token-not-for-production-0001
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: questlog
      S3_SECRET_KEY: questlog-local-secret
      S3_BUCKET: questlog-photos
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

volumes:
  pgdata:
  photos:
